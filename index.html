<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meal Pix</title>
<meta name="description" content="A colorful meal planner: save meals with photos, shuffle your week, and get a combined grocery list.">
<meta name="theme-color" content="#5B4BF0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Pix">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
/* Layout: one narrow column, week grid of colored meal pills, bottom sheets for picking/editing */
:root{
  --bg:#F4F5FA; --surface:#FFFFFF; --line:#E2E4EE; --fg:#1B1D2A; --muted:#6B6F85; --accent:#5B4BF0;
  --ink:#1B1D2A; /* text on meal colors, same in both themes */
  --tomato:#FF7A66; --mango:#FFC23D; --lime:#9EDB5A; --sky:#5CC0F7; --grape:#B08BFF; --bubble:#FF8FC4; --teal:#3ED6C4;
  --cherry:#FF5C6C; --coral:#FF9478; --peach:#FFBE98; --tangerine:#FF9F45; --butter:#FFE27A; --lemon:#F4F06A;
  --pistachio:#C9E89A; --mint:#8EEBC0; --sage:#A9C8A0; --aqua:#7FE3E8; --cornflower:#7DA7FF; --periwinkle:#A9B4FF;
  --lavender:#D2BCFF; --orchid:#E59BEA; --blush:#FFC4D6; --rose:#F48FA8; --sand:#E8D3B0; --clay:#D9A07E;
  --cloud:#E4E8F2; --stone:#B9BCC8;
  --sprout:#2F8A3B;
  --display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13141B; --surface:#1D1F2A; --line:#2C2F3D; --fg:#F1F2F8; --muted:#9A9EB5; --accent:#9C90FF; --sprout:#6FCB78; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#13141B; --surface:#1D1F2A; --line:#2C2F3D; --fg:#F1F2F8; --muted:#9A9EB5; --accent:#9C90FF; --sprout:#6FCB78; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1;margin:0;letter-spacing:-.02em}
h1 .dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
h1 .dots i{width:10px;height:10px;border-radius:50%;display:block}
.status{font-size:12px;color:var(--muted)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.tabs button{padding:9px 6px;border-radius:999px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}

.bar{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border-radius:999px;font-weight:600;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none}
.btn.danger{color:#E5484D}
.btn svg{width:18px;height:18px}

/* Week */
.week{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:52px 1fr 1fr;gap:8px;align-items:stretch}
.dlabel{display:flex;flex-direction:column;justify-content:center;font-family:var(--display);font-weight:600;line-height:1.1}
.dlabel small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.day.today .dlabel{color:var(--accent)}
.slot{min-height:58px;border-radius:var(--r);padding:8px 12px;text-align:left;display:flex;flex-direction:column;justify-content:center;min-width:0;transition:transform .12s}
.slot:active{transform:scale(.97)}
.slot .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;opacity:.7}
.slot .n{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2;overflow-wrap:anywhere}
@media (max-width:460px){.slot{padding:8px 10px}.slot .n{font-size:14px}.sthumb{width:34px;height:34px;border-radius:9px}}
.slot.empty{border:2px dashed var(--line);color:var(--muted)}
.slot.full{color:var(--ink)}
.slot.rolling{animation:wob .14s infinite alternate}
@keyframes wob{to{transform:translateY(-2px) rotate(-.6deg)}}

/* Meals */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{border-radius:20px;position:relative;color:var(--ink);min-width:0;display:flex}
.cardbtn{flex:1;min-width:0;padding:14px;min-height:126px;text-align:left;display:flex;flex-direction:column;gap:6px;border-radius:20px}
.card .meta{padding-right:42px;min-height:26px;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px}
.card .meta>span:last-child{white-space:nowrap}
@media (max-width:460px){.subtabs button{padding:7px 11px;font-size:13px}}
.cimg{display:block;width:calc(100% + 28px);max-width:none;margin:-14px -14px 4px;aspect-ratio:16/10;object-fit:cover;border-radius:20px 20px 0 0}
.slot.withimg{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;padding-left:6px}
.slot .sx{display:flex;flex-direction:column;min-width:0}
.sthumb{width:44px;height:44px;flex:none;border-radius:12px;object-fit:cover}
.photo-pick{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-box{width:120px;height:90px;border-radius:16px;border:2px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;flex:none}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-pick input{position:absolute;width:1px;height:1px;opacity:0}
.swatches.sm button{width:30px;height:30px}
.swatches.collapsed .extra{display:none}
.swatches.collapsed button:not(.more-sw){--d:min(36px,calc((100vw - 156px)/8));width:var(--d);height:var(--d);min-width:0;flex:none;padding:0;border-radius:50%}
.swatches.collapsed{gap:6px}
.swatches.collapsed{flex-wrap:nowrap}
.swatches .more-sw{aspect-ratio:auto!important;flex:none;width:auto!important;height:36px;border-radius:999px;padding:0 14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--fg)}
.swatches.sm .more-sw{height:30px}
.sw-none{background:var(--surface)!important;border:2px solid var(--line);position:relative;overflow:hidden}
.sw-none::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:#E5484D;transform:rotate(45deg)}
.preview-card{border-radius:20px;padding:14px;min-height:70px;display:flex;align-items:center;gap:12px;color:var(--ink)}
.preview-card img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.preview-card b{font-family:var(--display);font-size:18px;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:opacity .2s,transform .2s;z-index:40;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.foot2{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;color:var(--muted);font-size:13px;padding-top:18px;border-top:1px solid var(--line)}
.foot2 p{margin:0}
.heart{position:absolute;bottom:8px;right:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.55);color:var(--ink)}
.heart svg{width:20px;height:20px}
.heart[aria-pressed="true"]{background:#FFFFFF;color:#E5345E}
.heart.big{position:static;width:auto;height:auto;border-radius:999px;padding:11px 16px;display:inline-flex;gap:8px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--fg)}
.heart.big[aria-pressed="true"]{color:#E5345E;border-color:#E5345E}
.card h3{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1;margin:0;text-wrap:balance}
.card p{margin:0;font-size:13px;opacity:.75;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .meta{margin-top:auto;font-size:12px;font-weight:600;opacity:.7}
.card.add{background:var(--surface);border:2px dashed var(--line);color:var(--muted);align-items:center;justify-content:center;font-weight:600;flex-direction:column;gap:6px;min-height:126px}

.subtabs{display:flex;gap:6px;flex-wrap:wrap}
.subtabs button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px;border:1.5px solid var(--line);color:var(--muted);background:var(--surface)}
.subtabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.subtabs .n{opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}
.card .chip2.hot{background:var(--sprout);color:#fff}
.card .chip2{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,255,255,.6);color:var(--ink);border-radius:999px;padding:2px 8px}
.ingl{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none}
.ingl li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface)}
.ingl li span{flex:1}
.ingl li .tag{flex:none}
.empty-state{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.empty-state h2{font-family:var(--display);font-size:22px;margin:0}
.empty-state p{margin:0;color:var(--muted)}

/* List */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:6px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px}
.item input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.item label{flex:1;min-width:0;cursor:pointer}
.item .ct{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);font-weight:600}
.item.done .open>span:first-child{text-decoration:line-through;color:var(--muted)}
.item .from{display:flex;gap:3px}
.item .from i{width:8px;height:8px;border-radius:50%}
.note{color:var(--muted);font-size:13px;margin:0}
.cart{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.cart .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cart h3{margin:0;font-family:var(--display);font-size:17px;display:flex;align-items:center;gap:8px}
.cart h3 i{width:10px;height:10px;border-radius:50%;background:var(--sprout)}
.cart .btn{padding:8px 14px;font-size:14px}
.cart details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--muted)}
.cart ul{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.cart ul span{color:var(--muted);font-variant-numeric:tabular-nums}
.shelf{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.tile{display:flex;align-items:center;gap:12px;padding:6px;border-radius:14px;min-width:0}
.tile .art{width:52px;height:52px;flex:none;border-radius:14px;display:grid;place-items:center;color:var(--ink);overflow:hidden}
.tile .art svg{width:46%;height:46%}
.tile p{margin:0;flex:1;min-width:0;font-size:14px;line-height:1.3;font-weight:500}
.tile .q{flex:none;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.shelf h4{margin:10px 6px 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.shelf h4 i{width:9px;height:9px;border-radius:50%}
.tile .art.photo{background:#FFFFFF;box-shadow:inset 0 0 0 3px var(--ring)}
.tile .art img{width:100%;height:100%;object-fit:contain;padding:3px;border-radius:14px}
.item .pic{width:38px;height:38px;flex:none;border-radius:10px;background:#FFFFFF;object-fit:contain;padding:2px;border:1px solid var(--line)}
.credit{font-size:11px;color:var(--muted);margin:0}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sprout);border:1.5px solid var(--sprout);border-radius:999px;padding:2px 8px;white-space:nowrap}
.item .sub{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;overflow:auto;border-radius:24px 24px 0 0;
  padding:18px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px));
  display:flex;flex-direction:column;gap:14px}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.cropper{display:flex;flex-direction:column;gap:10px}
.stage{position:relative;width:100%;aspect-ratio:16/10;max-width:100%;border-radius:18px;overflow:hidden;background:var(--line);touch-action:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage canvas{display:block;width:100%;height:100%}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:18px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.7);
  background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 33.33% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 66.66% 0/1px 100% no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 33.33%/100% 1px no-repeat,linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)) 0 66.66%/100% 1px no-repeat}
.ratios{display:flex;gap:6px;flex-wrap:wrap}
.ratios button{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.ratios button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.crop-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.crop-tools input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.icobtn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.icobtn svg{width:20px;height:20px}
.lblrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nob{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.nob[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{padding:6px 12px;border-radius:999px;border:1.5px dashed var(--line);font-size:14px;color:var(--fg);background:none}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
button.tile{width:100%;text-align:left}
button.tile:hover{background:var(--bg)}
.item .open{flex:1;min-width:0;text-align:left;padding:0}
.bigpic{width:100%;height:260px;max-width:100%;border-radius:20px;background:#FFFFFF;display:grid;place-items:center;overflow:hidden;border:1px solid var(--line)}
.bigpic img{max-width:100%;max-height:100%;object-fit:contain;padding:12px}
.bigicon{width:100%;height:200px;border-radius:20px;display:grid;place-items:center;color:var(--ink)}
.bigicon svg{width:72px;height:72px}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.facts span{font-size:13px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line)}
.sheetwrap{position:relative;width:100%;max-width:560px;animation:up .22s ease-out}
.sheet{max-height:88vh;max-height:88dvh}
.xclose{position:absolute;top:-48px;right:max(12px, env(safe-area-inset-right, 0px));z-index:3;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.xclose svg{width:18px;height:18px}

.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:5px}
.tool{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 4px;border-radius:13px;font-size:12px;font-weight:600;color:var(--fg);line-height:1.15;text-align:center}
.tool svg{width:18px;height:18px}
.tool:hover{background:var(--bg)}
.tool.primary{background:var(--accent);color:#fff}
.tool.green{background:#CDEFC6;color:#1B1D2A}
.tool.yellow{background:#FFF0B3;color:#1B1D2A}
.slotgroup{display:flex;flex-direction:column;gap:4px;min-width:0;border-radius:16px;padding:6px;background:var(--surface);border:1px solid var(--line)}
.slotgroup>.k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);padding:0 4px}
.mini{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 5px;border-radius:12px;text-align:left;min-width:0;font-size:13px}
.mini .n{font-weight:600;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.2}
.mini.full{color:var(--ink)}
.mini.empty{border:1.5px dashed var(--line);color:var(--muted)}
.mini.rolling{animation:wob .14s infinite alternate}
.addround{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1.5px dashed var(--line);background:var(--surface);color:var(--muted)}
.addround svg{width:18px;height:18px}
.tool:disabled{opacity:.35;cursor:default}
.tool:not(:disabled):active{transform:scale(.96)}
.people{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.people button{display:inline-flex;align-items:center;gap:7px;padding:4px 12px 4px 4px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;color:var(--fg)}
.people button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.people button[aria-pressed="false"] .ava{opacity:.55}
.people .addp{padding:6px 12px;color:var(--muted);border-style:dashed}
.people.sm button{font-size:13px}
.ava{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink);flex:none}
.fdots{display:inline-flex;margin-right:6px}
.fdots .ava{border:2px solid rgba(255,255,255,.85);margin-right:-5px;font-size:9px}
.picks{display:flex;flex-direction:column;gap:6px}
.person{display:flex;flex-direction:column;gap:8px;padding:10px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.person .swatches button{width:28px;height:28px}
.gallery{display:flex;width:100%;max-width:100%;max-height:62vh;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;border-radius:18px;background:var(--surface);scrollbar-width:none;flex:none}
.gallery::-webkit-scrollbar{display:none}
.gallery img{flex:0 0 100%;width:100%;max-width:100%;height:100%;object-fit:contain;scroll-snap-align:center;scroll-snap-stop:always}
.gdots{display:flex;justify-content:center;gap:6px;margin-top:-6px}
.gdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.gdots i.on{background:var(--fg)}
.pstrip{display:flex;gap:8px;flex-wrap:wrap}
.pth{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;flex:none;background:var(--surface);border:1px solid var(--line)}

.padd{width:84px;height:84px;border-radius:14px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;flex:none;background:var(--surface)}

.pfc{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:15px;font-variant-numeric:tabular-nums}

.pfc .dash{color:var(--muted)}
.nut{display:flex;flex-direction:column;gap:8px}

.nutrow .nl{font-weight:600;font-size:14px}
.nutrow .nin{padding:9px 12px;min-width:0}
.lmh{display:flex;gap:4px}
.lmh button{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.lmh button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;margin:0}

.pick button{padding:8px 12px 8px 8px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* ---------- storage ---------- */
function migrate(st){
  if(!Array.isArray(st.ings)) st.ings=[];
  if(!st.v||st.v<2){
    st.meals.forEach(m=>{m.rec=true;m.fav=false});
    RECS.forEach(r=>{ if(!st.meals.some(m=>m.name.trim().toLowerCase()===r.name.toLowerCase())) st.meals.push({id:r.id,name:r.name,color:r.color,ingredients:[...r.ingredients],rec:true,fav:false}) });
    st.v=2;
  }
  if(st.v<3||!Array.isArray(st.users)||!st.users.length){
    if(!Array.isArray(st.users)||!st.users.length) st.users=[{id:'u1',name:'Me',color:'tomato'}];
    st.meals.forEach(m=>{ if(!Array.isArray(m.favBy)) m.favBy=m.fav?[st.users[0].id]:[]; delete m.fav });
    st.v=3;
  }
  st.meals.forEach(m=>{ if(!Array.isArray(m.favBy)) m.favBy=[] });
  if(!st.users.some(u=>u.id===st.activeUser)) st.activeUser=st.users[0].id;
  if(!st.plans||typeof st.plans!=='object') st.plans={};
  if(st.plan&&typeof st.plan==='object'&&Object.keys(st.plan).length&&!Object.keys(st.plans).length) st.plans[st.users[0].id]=st.plan;
  delete st.plan;
  st.weekUsers=(Array.isArray(st.weekUsers)?st.weekUsers:[]).filter(id=>st.users.some(u=>u.id===id));
  if(!st.weekUsers.length) st.weekUsers=[st.activeUser];
  return st;
}
function normalize(d){
  try{ d=JSON.parse(JSON.stringify(d||{})) }catch(e){ d={} }
  return migrate({v:d?.v,meals:Array.isArray(d?.meals)?d.meals.filter(m=>m&&m.id&&m.name):[], plan:(d&&typeof d.plan==='object'&&d.plan)||{}, plans:(d&&typeof d.plans==='object'&&d.plans)||{}, checked:(d&&typeof d.checked==='object'&&d.checked)||{}, cart:(d&&d.cart&&Array.isArray(d.cart.items))?d.cart:null, ings:Array.isArray(d?.ings)?d.ings.filter(x=>typeof x==='string'):[], cartPhotos:(d&&d.cartPhotos&&typeof d.cartPhotos==='object')?d.cartPhotos:{}, users:Array.isArray(d?.users)?d.users.filter(u=>u&&u.id&&u.name).slice(0,4):[], activeUser:d?.activeUser||'', weekUsers:Array.isArray(d?.weekUsers)?d.weekUsers:[]});
}
try{const c=localStorage.getItem(KEY); if(c) S=normalize(JSON.parse(c));}catch(e){}
S=migrate(S);
let tmr, saving=false, again=false;

function weekDates(){
  const now=new Date(); const dow=(now.getDay()+6)%7;

const getSlot=(d,s,u=S.activeUser)=>S.plans[u]?.[d]?.[s]||null;

function randomPick(exclude,u){const pool0=u?userPool(u):pool(); const p0=pool0.filter(m=>m.id!==exclude); const pool1=p0.length?p0:pool0; return pool1[Math.floor(Math.random()*pool1.length)]}

/* ---------- Instacart (Sprouts cart) ---------- */
const STORE='Sprouts Farmers Market';
let mcpP=null, cartMsg='', syncing=false;
const getMcp=()=>mcpP||(mcpP=(window.claude?.use?claude.use('mcp'):Promise.resolve(null)).catch(()=>null));
function extractCart(res){
  const c=[res?.structuredContent,res?.payload];
  for(const b of res?.content||[]) if(b&&b.type==='text'&&typeof b.text==='string'){const i=b.text.indexOf('{'); if(i>=0){try{c.push(JSON.parse(b.text.slice(i)))}catch(e){}}}
  for(const o of c){ if(!o||typeof o!=='object') continue;
    const items=o.artifacts?.cart?.items||o.cart?.items;
    if(Array.isArray(items)) return {items:items.filter(x=>x&&x.name).map(x=>({name:String(x.name),qty:Number(x.quantity)||1})), retailer:o.artifacts?.retailer?.name||STORE};
  }
  return null;
}
async function syncCart(){
  if(syncing) return; syncing=true; cartMsg=''; render();

    const res=await mcp.callTool('Instacart','cart',{retailer_name:STORE},{cache:false});

    else cartMsg='Instacart answered, but the cart couldn’t be read. Try Sync again.';

    cartMsg=({server_not_connected:'Instacart isn’t connected. Add it in claude.ai Settings → Connectors.',

  }

}
const sing=w=>/(oes|ches|shes|xes)$/.test(w)?w.slice(0,-2):(w.length>3&&w.endsWith('s')&&!w.endsWith('ss')?w.slice(0,-1):w);
const words=t=>t.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(Boolean).map(sing);

  const items=S.cart?.items; if(!items?.length) return null;

const CATS=[

/* ---------- shuffle with a little slot-machine roll ---------- */
let rolling=false;
const undoStack=[];
function snap(){ undoStack.push(JSON.stringify(S.plans)); if(undoStack.length>40) undoStack.shift(); }
async function shuffleSlots(all){
  if(rolling||!S.meals.length) return;
  const targets=[]; shownUsers().forEach(u=>DAYS.forEach((_,i)=>SLOTS.forEach(([s])=>{ if(all||!getSlot(i,s,u.id)) targets.push([i,s,u.id]) })));
  if(!targets.length){toast('Every slot is filled. Try Random roll.');return}
  // even spread: cycle a shuffled deck so repeats happen only when needed
  const decks={}; const results=targets.map(([,,u])=>{ if(!decks[u]?.length) decks[u]=shuffled(userPool(u)); return decks[u].pop().id });
  snap(); targets.forEach(([i,s,u],k)=>setSlot(i,s,results[k],u));
  rolling=true;
  if(!reduce){
    render();
    const els=targets.map(([i,s,u])=>document.querySelector(`[data-slot="${i}-${s}-${u}"]`)).filter(Boolean);
    els.forEach(el=>{el.classList.add('rolling','full');el.classList.remove('empty')});
    const t0=performance.now();
    await new Promise(res=>{
      const tick=()=>{
        const t=performance.now()-t0; let live=0;
        els.forEach((el,k)=>{
          if(!el.classList.contains('rolling')) return;
          if(t>350+k*45){el.classList.remove('rolling');return}
          live++; const m=S.meals[Math.floor(Math.random()*S.meals.length)];
          el.style.background=col(m.color); el.querySelector('.n').textContent=m.name;
        });
        live?setTimeout(tick,70):res();
      }; tick();
    });
  }
  rolling=false; render(); save();
}

/* photos live in this browser's IndexedDB; meals point at them as "idb:<id>" */
const IDB_NAME='meal-pix', IDB_STORE='photos';
let idbP=null; const picURL={};
function idb(){ return idbP||(idbP=new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error) })) }

const idbPut=(k,blob)=>idbDo('readwrite',st=>st.put(blob,k));
const idbGet=k=>idbDo('readonly',st=>st.get(k));
const idbKeys=()=>idbDo('readonly',st=>st.getAllKeys());
const idbDel=k=>idbDo('readwrite',st=>st.delete(k));
function pic(u){ if(!u) return ''; if(u.startsWith('idb:')) return picURL[u]||''; return u }
async function loadPics(){

async function shrink(file,max){
  const url=URL.createObjectURL(file);

    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);

  } finally { URL.revokeObjectURL(url) }
}

function makeCropper(host,img,onDone,onCancel){
  const st={rot:0,z:1,fx:0,fy:0,ratio:'full'};
  host.innerHTML=`<div class="cropper">
    <div class="ratios" role="group" aria-label="Shape">${RATIOS.map(([k,l])=>`<button type="button" data-ratio="${k}" aria-pressed="${k==='full'}">${l}</button>`).join('')}</div>

    <div class="crop-tools"><button type="button" class="icobtn" id="rl" aria-label="Turn left">${ROT_L}</button><button type="button" class="icobtn" id="rr" aria-label="Turn right">${ROT_R}</button>
    <label class="note" for="zm" style="flex:none">Zoom</label><input type="range" id="zm" min="1" max="4" step="0.01" value="1"></div>
    <p class="note" style="margin:0" id="hint">Showing the whole photo. Pick a shape to crop it.</p>
    <div class="row"><button type="button" class="btn ghost" id="ccl">Cancel</button><button type="button" class="btn primary" id="cok">Use photo</button></div></div>`;
  const stage=host.querySelector('#stg'), cv=host.querySelector('#cv');
  const dims=()=>{const odd=st.rot%2; return [odd?img.naturalHeight:img.naturalWidth, odd?img.naturalWidth:img.naturalHeight]};
  const ar=()=>{if(st.ratio==='full'){const [w,h]=dims();return w/h} const [a,b]=st.ratio.split(':').map(Number); return a/b};
  const shape=()=>{const r=ar(); stage.style.aspectRatio=String(r); stage.style.width=`min(100%, calc(52vh * ${r.toFixed(4)}))`; stage.style.margin='0 auto';
    host.querySelector('#hint').textContent=st.ratio==='full'?'Showing the whole photo. Zoom or pick a shape to crop it.':'Drag the photo to frame it.'};
  const clamp=(W,H)=>{const [rw,rh]=dims(); const s=Math.max(W/rw,H/rh)*st.z; const mx=Math.max(0,(rw*s-W)/2)/W, my=Math.max(0,(rh*s-H)/2)/H; st.fx=Math.max(-mx,Math.min(mx,st.fx)); st.fy=Math.max(-my,Math.min(my,st.fy)); return s};
  const paint=(ctx,W,H)=>{const s=clamp(W,H); ctx.save(); ctx.clearRect(0,0,W,H); ctx.translate(W/2+st.fx*W,H/2+st.fy*H); ctx.rotate(st.rot*Math.PI/2); ctx.scale(s,s); ctx.drawImage(img,-img.naturalWidth/2,-img.naturalHeight/2); ctx.restore()};
  const draw=()=>{const r=stage.getBoundingClientRect(); const d=window.devicePixelRatio||1; cv.width=Math.max(1,Math.round(r.width*d)); cv.height=Math.max(1,Math.round(r.height*d)); paint(cv.getContext('2d'),cv.width,cv.height)};
  shape(); requestAnimationFrame(draw);
  let drag=null;
  stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};stage.setPointerCapture(e.pointerId)});
  stage.addEventListener('pointermove',e=>{if(!drag) return; const r=stage.getBoundingClientRect(); st.fx+=(e.clientX-drag.x)/r.width; st.fy+=(e.clientY-drag.y)/r.height; drag={x:e.clientX,y:e.clientY}; draw()});
  const end=()=>{drag=null}; stage.addEventListener('pointerup',end); stage.addEventListener('pointercancel',end);
  stage.addEventListener('wheel',e=>{e.preventDefault(); st.z=Math.max(1,Math.min(4,st.z*(e.deltaY<0?1.06:0.94))); host.querySelector('#zm').value=st.z; draw()},{passive:false});
  host.querySelector('#zm').addEventListener('input',e=>{st.z=+e.target.value; draw()});
  const turn=d=>{st.rot=(st.rot+d)%4; st.fx=0; st.fy=0; shape(); requestAnimationFrame(draw)};
  host.querySelector('#rl').addEventListener('click',()=>turn(3));
  host.querySelector('#rr').addEventListener('click',()=>turn(1));
  host.querySelectorAll('[data-ratio]').forEach(b=>b.addEventListener('click',()=>{st.ratio=b.dataset.ratio; st.fx=0; st.fy=0; st.z=1; host.querySelector('#zm').value=1;
    host.querySelectorAll('[data-ratio]').forEach(x=>x.setAttribute('aria-pressed',x===b)); shape(); requestAnimationFrame(draw)}));
  host.querySelector('#ccl').addEventListener('click',onCancel);
  host.querySelector('#cok').addEventListener('click',()=>{const r=ar(), L=1200; const W=r>=1?L:Math.round(L*r), H=r>=1?Math.round(L/r):L;
    const out=document.createElement('canvas'); out.width=W; out.height=H; paint(out.getContext('2d'),W,H); out.toBlob(b=>onDone(b,Math.round(r*1000)/1000),'image/jpeg',.88)});
}

        S.users=list; S.meals.forEach(m=>m.favBy=(m.favBy||[]).filter(id=>keep.has(id)));
        if(!keep.has(S.activeUser)) S.activeUser=list[0].id;
        if(adding){const added=list.find(u=>!draft.slice(0,-1).some(x=>x.id===u.id)&&u.id===draft[draft.length-1].id); if(added) S.activeUser=added.id}
        S.weekUsers=S.weekUsers.filter(id=>keep.has(id)); if(!S.weekUsers.length) S.weekUsers=[S.activeUser];
        closeSheet(); render(); save();
      }
    });
    setTimeout(()=>{const f=[...sh.querySelectorAll('[data-pn]')].find(x=>!x.value); f&&f.focus()},60);
  });
}
const NUTS=[['p','Protein','P'],['f','Fiber','F'],['c','Carbs','C']];
function normNut(v){ v=String(v||'').trim(); if(!v) return ''; const n=v.match(/^(\d+(?:\.\d+)?)\s*(g|grams?)?$/i); if(n) return n[1]+'g';
  const l=v.toLowerCase(); if(l==='low'||l==='lo') return 'Low'; if(l==='med'||l==='medium'||l==='mid') return 'Med'; if(l==='high'||l==='hi') return 'High'; return null }
const mealPhotos=m=>Array.isArray(m.imgs)&&m.imgs.length?m.imgs:(m.img?[{u:m.img,r:m.ratio||0}]:[]);

async function blobToDataURL(b){ return new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)}) }
async function backup(){
  toast('Preparing backup…');
  const photos={};
  for(const id of usedPicIds()){ try{ const b=await idbGet(id); if(b) photos[id]=await blobToDataURL(b) }catch(e){} }
  const data={app:'meal-pix',version:1,saved:new Date().toISOString(),state:S,photos};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`meal-pix-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove()},1500);
}
async function restore(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='meal-pix'||!data.state) throw new Error('not a backup');
    for(const [id,durl] of Object.entries(data.photos||{})){ const b=await (await fetch(durl)).blob(); await idbPut(id,b); picURL['idb:'+id]=URL.createObjectURL(b) }
    S=normalize(data.state); undoStack.length=0; save(); render(); toast('Backup restored');
  }catch(e){ toast('That file isn’t a Meal Pix backup.') }
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.matches('[data-close]')||e.target.closest('[data-x]')){closeSheet();return}
  const t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;render();return}
  const g=e.target.closest('[data-goto]'); if(g){tab=g.dataset.goto;render();return}
  if(e.target.closest('#sheetRoot')) return;
  const sl=e.target.closest('[data-slot]'); if(sl&&!rolling){const [d,s,u]=sl.dataset.slot.split('-');pickSheet(+d,s,u);return}
  const au=e.target.closest('[data-auser]'); if(au){S.activeUser=au.dataset.auser;render();save();return}
  const wu=e.target.closest('[data-wuser]'); if(wu){const id=wu.dataset.wuser; const on=S.weekUsers.includes(id); if(on&&S.weekUsers.length===1){toast('Keep at least one person’s picks on');return} S.weekUsers=on?S.weekUsers.filter(x=>x!==id):[...S.weekUsers,id];render();save();return}
  const mt=e.target.closest('[data-mtab]'); if(mt){mealsTab=mt.dataset.mtab;tab='meals';render();return}
  const fv=e.target.closest('[data-fav]'); if(fv){const m=meal(fv.dataset.fav); if(m){toggleFav(m); render(); save()} return}
  const ci=e.target.closest('[data-citem]'); if(ci){cartItemSheet(ci.dataset.citem);return}
  const gi=e.target.closest('[data-gitem]'); if(gi){groceryItemSheet(gi.dataset.gitem);return}
  const op=e.target.closest('[data-open]'); if(op){mealSheet(op.dataset.open);return}
  const ed=e.target.closest('[data-edit]'); if(ed){editSheet(ed.dataset.edit);return}
  const a=e.target.closest('[data-act]')?.dataset.act;
  if(a==='new') editSheet(null);
  if(a==='starters'){STARTERS.forEach(([name,color,ingredients])=>S.meals.push({id:uid(),name,color,ingredients}));render();save()}
  if(a==='fill') shuffleSlots(false);
  if(a==='reroll') shuffleSlots(true);
  if(a==='clearweek'){ const has=shownUsers().some(u=>Object.values(S.plans[u.id]||{}).some(x=>x&&Object.keys(x).length)); if(has){snap();shownUsers().forEach(u=>{S.plans[u.id]={}});render();save()} }
  if(a==='undo'&&undoStack.length){S.plans=JSON.parse(undoStack.pop());render();save()}
  if(a==='backup') backup();
  if(a==='people') peopleSheet();
  if(a==='addperson') peopleSheet(true);
  if(a==='sync') syncCart();
  if(a==='uncheck'){S.checked={};render();save()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreIn'){ const f=e.target.files&&e.target.files[0]; if(f) restore(f); e.target.value=''; return }
  const c=e.target.closest('[data-check]'); if(!c) return;
  if(c.checked) S.checked[c.dataset.check]=true; else delete S.checked[c.dataset.check];
  render();save();
});
render();
loadPics().then(render);
if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist() }catch(e){}
